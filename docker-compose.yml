services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eco-inversion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eco_inversion_cr}
      POSTGRES_USER: ${POSTGRES_USER:-eco_inversion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eco_inversion_db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eco_inversion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: eco-inversion-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eco_inversion}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-eco_inversion_cr}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

volumes:
  eco_inversion_db_data:
