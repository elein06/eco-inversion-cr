[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "api: pruebas contra una base PostgreSQL+PostGIS de pruebas (requieren TEST_DATABASE_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · S: reglas de seguridad (bandit)
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
    "B008",   # Depends() en argumentos por defecto es el patrón de FastAPI
    "UP032",  # .format() en SQL de los routers existentes: estilo, no defecto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y contraseñas ficticias en pruebas
# Los routers arman SQL con f-strings solo para listas de COLUMNAS/WHERE
# constantes; los valores siempre van como parámetros (%s).
"app/routers/*.py" = ["S608"]
"app/config.py" = ["S104"]  # 0.0.0.0 es intencional dentro del contenedor
