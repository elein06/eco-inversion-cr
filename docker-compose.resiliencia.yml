# Experimento de resiliencia con Toxiproxy (ítem 4.10, ver docs/resiliencia.md).
# Solo para el ambiente de pruebas: se suma al compose normal.
#
#   docker compose -f docker-compose.yml -f docker-compose.resiliencia.yml up -d db toxiproxy
#
# Toxiproxy se coloca entre la API y PostgreSQL. Las pruebas y el script de
# carga crean el proxy "postgres" (puerto 15432 -> db:5432) por su API (8474).
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: eco-inversion-toxiproxy
    depends_on:
      db:
        condition: service_healthy
    ports:
      # La API de Toxiproxy NO tiene autenticación: quien la alcance puede
      # cortar la base. Por eso ambos puertos se publican solo en 127.0.0.1.
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:15432:15432"
